[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atp"
version = "0.1.0"
description = "SENTRY — governed systematic research platform (Command Centre GUI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
browser = [
    "playwright>=1.44",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"atp.gui.command_centre" = ["static/**/*", "contract/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "browser: drives the real UI in headless Chromium (skipped if Playwright is unavailable)",
]
